services:
  - type: web
    name: bos-gemn
    env: python
    pythonVersion: 3.12.16
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars: []
